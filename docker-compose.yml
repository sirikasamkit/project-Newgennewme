services:
  # Frontend Service (Vite Development / Nginx Build)
  frontend:
    image: node:20-alpine
    container_name: newgen_frontend
    working_dir: /app
    volumes:
      - ./Frontend:/app
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend

  # Backend Service (Node.js Express Modular API)
  backend:
    image: node:20-alpine
    container_name: newgen_backend
    working_dir: /app
    volumes:
      - ./Backend:/app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET:-newgen_super_secret_key}
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=rootpassword
      - DB_NAME=newgen_db
      - DB_PORT=3306
    command: sh -c "npm install && npm start"
    depends_on:
      - db

  # Database Service (MySQL 8.0)
  db:
    image: mysql:8.0
    container_name: newgen_db
    environment:
      MYSQL_DATABASE: newgen_db
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: